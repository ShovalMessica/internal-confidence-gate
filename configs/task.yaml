# Required — replace null with your values.
model_name_or_path: null  # Hugging Face ID or absolute checkpoint path
dataset_path: null        # Absolute path to your JSONL dataset
reasoning_mode: null      # direct or reasoning

# Optional fixed system message shared by every example.
# system_prompt_path: "C:/path/to/system-prompt.md"

# Model loading defaults
# model_revision: "abc123" # Optional Hub commit, tag, or branch
device: auto               # auto, cpu, cuda, or cuda:N
dtype: auto                # auto, float16, bfloat16, or float32

# Optional — uncomment to choose an absolute output directory.
# Otherwise, use an outputs folder beside this YAML.
# output_dir: "C:/results/my-task"

# Optional — defaults
reasoning_max_new_tokens: 1024  # Used only in reasoning mode
answer_max_new_tokens: 64
allow_abstention: true
# answer_matcher_path: "C:/path/to/answer_matcher.py"
# custom_metrics_path: "C:/path/to/custom_metrics.py"
generation_seed: 42
direct_batch_size: 8       # Used only in direct mode
decoding_strategy: model_default    # model_default or greedy
probe_seed: 42
# probe_positions: [prompt_end]  # Omit to train every captured position
# probe_layers: [35]             # 0 is the embedding output; omit for every state
probe_regularization_c: 1.0
probe_class_weight: balanced     # balanced or none
target_tpr: 0.90           # Retain at least this fraction of correct validation predictions

# Used only when the dataset omits split assignments.
split_ratios:
  train: 0.70
  validation: 0.15
  test: 0.15
split_seed: 42
